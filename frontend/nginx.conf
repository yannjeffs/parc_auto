server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Essentiel pour une SPA Angular : toute route inconnue de Nginx (ex: /vehicules/123)
    # doit quand même renvoyer index.html — c'est Angular Router qui gère la route
    # côté client, pas Nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long pour les fichiers versionnés par le build (hash dans le nom)
    location ~* \.(js|css|woff2?|png|jpg|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
