<div class="page-header">
  <h1>Comptes utilisateurs</h1>
  <button mat-flat-button color="primary" (click)="openCreateDialog()">
    <mat-icon>person_add</mat-icon>
    Nouveau compte
  </button>
</div>

<div class="table-container">
  @if (isLoading) {
    <div class="loading-overlay">
      <mat-spinner diameter="40"></mat-spinner>
    </div>
  }

  <table mat-table [dataSource]="utilisateurs">
    <ng-container matColumnDef="username">
      <th mat-header-cell *matHeaderCellDef>Nom d'utilisateur</th>
      <td mat-cell *matCellDef="let u">{{ u.username }}</td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let u">{{ u.email || '—' }}</td>
    </ng-container>

    <ng-container matColumnDef="role">
      <th mat-header-cell *matHeaderCellDef>Rôle</th>
      <td mat-cell *matCellDef="let u">{{ roleLabels[u.role] }}</td>
    </ng-container>

    <ng-container matColumnDef="statut">
      <th mat-header-cell *matHeaderCellDef>Statut</th>
      <td mat-cell *matCellDef="let u">
        <span class="statut-chip" [ngClass]="u.is_active ? 'statut-ok' : 'statut-neutral'">
          {{ u.is_active ? 'Actif' : 'Désactivé' }}
        </span>
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let u">
        <button
          mat-icon-button
          (click)="openEditDialog(u)"
          aria-label="Modifier"
          matTooltip="Modifier"
        >
          <mat-icon>edit</mat-icon>
        </button>
        <button
          mat-icon-button
          (click)="toggleActif(u)"
          matTooltip="Supprimer"
          [attr.aria-label]="u.is_active ? 'Désactiver' : 'Réactiver'"
        >
          <mat-icon>{{ u.is_active ? 'block' : 'check_circle' }}</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  @if (!isLoading && utilisateurs.length === 0) {
    <p class="empty-state">Aucun compte trouvé.</p>
  }
</div>
