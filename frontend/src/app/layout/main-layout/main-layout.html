<mat-sidenav-container class="app-container">
  <mat-sidenav
    #sidenav
    [mode]="isMobile ? 'over' : 'side'"
    [opened]="!isMobile"
    class="app-sidenav"
  >
    <div class="sidenav-header">
      <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true">
        <rect x="6" y="26" width="8" height="14" rx="3" fill="#80DEEA"/>
        <rect x="18" y="18" width="8" height="22" rx="3" fill="#00ACC1"/>
        <rect x="30" y="10" width="8" height="30" rx="3" fill="#FB8C00"/>
      </svg>
      <span>Convoy</span>
    </div>
    <mat-nav-list>
      @for (item of navItems; track item.route) {
        @if (!item.adminOnly || authService.isAdmin()) {
          <a
            mat-list-item
            [routerLink]="item.route"
            routerLinkActive="active-link"
            (click)="fermerSiMobile(sidenav)"
          >
            <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
            <span matListItemTitle>{{ item.label }}</span>
          </a>
        }
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary">
      @if (isMobile) {
        <button mat-icon-button (click)="sidenav.toggle()" aria-label="Ouvrir le menu">
          <mat-icon>menu</mat-icon>
        </button>
      }
      <span class="toolbar-title">{{ isMobile ? 'Convoy' : 'Convoy — Gestion de flotte automobile' }}</span>
      <span class="spacer"></span>
      @if (roleLabel && !isMobile) {
        <span class="role-badge">{{ roleLabel }}</span>
      }
      <app-notification-bell></app-notification-bell>
      <button mat-icon-button (click)="logout()" aria-label="Se déconnecter">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>

    <main class="content">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
