<mat-sidenav-container class="app-container">
  <mat-sidenav
    #sidenav
    [mode]="isMobile ? 'over' : 'side'"
    [opened]="!isMobile"
    class="app-sidenav"
  >
    <div class="sidenav-header">
      <mat-icon>directions_car</mat-icon>
      <span>Parc Auto</span>
    </div>
    <mat-nav-list>
      @for (item of navItems; track item.route) {
        <a
          mat-list-item
          [routerLink]="item.route"
          routerLinkActive="active-link"
          (click)="fermerSiMobile(sidenav)"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary">
      @if (isMobile) {
        <button mat-icon-button (click)="sidenav.toggle()" aria-label="Ouvrir le menu">
          <mat-icon>menu</mat-icon>
        </button>
      }
      <span class="toolbar-title">{{ isMobile ? 'Parc Auto' : 'Gestion de parc automobile' }}</span>
      <span class="spacer"></span>
      @if (roleLabel && !isMobile) {
        <span class="role-badge">{{ roleLabel }}</span>
      }
      <button mat-icon-button (click)="logout()" aria-label="Se déconnecter">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>

    <main class="content">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
